{% extends 'base.html' %}

{% block title %}लगइन - कृषि साथी प्रशासकीय पोर्टल{% endblock %}

{% block content %}
<div class="min-h-[75vh] flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <div class="sm:mx-auto sm:w-full sm:max-w-md text-center">
        <div class="w-16 h-16 rounded-2xl bg-agro-700 text-white flex items-center justify-center text-3xl mx-auto shadow-md">
            <i class="fa-solid fa-seedling"></i>
        </div>
        <h2 class="mt-4 text-3xl font-extrabold text-slate-900 tracking-tight">कृषि साथी प्रशासकीय पोर्टल</h2>
        <p class="mt-2 text-sm text-slate-600">प्रमाणित कृषि सल्लाह तथा सामग्री व्यवस्थापन प्रणाली</p>
    </div>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
        <div class="bg-white py-8 px-6 shadow-sm border border-slate-200 rounded-2xl sm:px-10">
            <form class="space-y-6" action="{% url 'accounts:login' %}" method="post">
                {% csrf_token %}
                <div>
                    <label for="username" class="block text-sm font-bold text-slate-700">प्रयोगकर्ता नाम / इमेल (Username / Email)</label>
                    <div class="mt-2 relative">
                        <input id="username" name="username" type="text" required class="block w-full px-4 py-3 rounded-xl border border-slate-300 shadow-sm focus:ring-2 focus:ring-agro-600 focus:border-agro-600 text-sm">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-bold text-slate-700">पासवर्ड (Password)</label>
                    <div class="mt-2 relative">
                        <input id="password" name="password" type="password" required class="block w-full px-4 py-3 rounded-xl border border-slate-300 shadow-sm focus:ring-2 focus:ring-agro-600 focus:border-agro-600 text-sm">
                    </div>
                </div>

                <div>
                    <button type="submit" class="w-full flex justify-center py-3.5 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-agro-700 hover:bg-agro-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-agro-600 transition">
                        <i class="fa-solid fa-lock mr-2 mt-0.5"></i>प्रशासक लगइन (Admin Login)
                    </button>
                </div>
            </form>
            <div class="mt-6 border-t border-slate-100 pt-4 text-center">
                <span class="text-xs text-slate-500">Super Admin & Content Admin Access Only</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
