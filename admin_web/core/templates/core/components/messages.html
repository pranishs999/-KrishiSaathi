{% if messages %}
<div class="space-y-2 mb-4">
    {% for msg in messages %}
    <div class="p-3 rounded border {% if msg.tags == 'error' %}bg-red-50 border-red-200 text-red-800{% else %}bg-emerald-50 border-emerald-200 text-emerald-900{% endif %} text-sm">
        {{ msg }}
    </div>
    {% endfor %}
</div>
{% endif %}
