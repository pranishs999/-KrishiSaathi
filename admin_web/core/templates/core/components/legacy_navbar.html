{% if user.is_authenticated %}
<nav class="bg-white border-b border-slate-200 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between h-16">
            <div class="flex items-center">
                <a href="{% url 'core:legacy_dashboard' %}" class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-agro-700 flex items-center justify-center text-white font-bold text-xl shadow-sm">
                        <i class="fa-solid fa-seedling"></i>
                    </div>
                    <div>
                        <span class="text-xl font-black text-slate-900 tracking-tight">कृषि साथी</span>
                        <span class="hidden sm:inline-block ml-1 text-xs font-bold text-agro-700 bg-agro-100 px-2 py-0.5 rounded-full uppercase">Admin Portal</span>
                    </div>
                </a>
                <div class="hidden md:flex ml-10 space-x-2">
                    <a href="{% url 'core:legacy_dashboard' %}" class="px-3 py-2 rounded-lg text-sm font-semibold {% if request.resolver_match.url_name == 'legacy_dashboard' %}text-agro-700 bg-agro-50{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                        <i class="fa-solid fa-chart-pie mr-1.5"></i>ड्यासबोर्ड (Overview)
                    </a>
                    <a href="{% url 'core:legacy_crops_list' %}" class="px-3 py-2 rounded-lg text-sm font-semibold {% if 'legacy_crop' in request.resolver_match.url_name %}text-agro-700 bg-agro-50{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                        <i class="fa-solid fa-leaf mr-1.5"></i>बाली निर्देशिका (Crops)
                    </a>
                    <a href="{% url 'core:legacy_guides_list' %}" class="px-3 py-2 rounded-lg text-sm font-semibold {% if 'legacy_guide' in request.resolver_match.url_name %}text-agro-700 bg-agro-50{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                        <i class="fa-solid fa-book-open mr-1.5"></i>खेती विधि (Guides)
                    </a>
                    <a href="{% url 'core:legacy_farmers' %}" class="px-3 py-2 rounded-lg text-sm font-semibold {% if request.resolver_match.url_name == 'legacy_farmers' %}text-agro-700 bg-agro-50{% else %}text-slate-600 hover:text-slate-900 hover:bg-slate-100{% endif %}">
                        <i class="fa-solid fa-users mr-1.5"></i>किसानहरू (Farmers)
                    </a>
                </div>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right hidden sm:block">
                    <div class="text-sm font-bold text-slate-800">{{ user.username }}</div>
                    <div class="text-xs text-slate-500 font-medium">
                        {% if user.is_superuser %}
                            <span class="text-purple-600 font-semibold"><i class="fa-solid fa-shield mr-1"></i>Super Admin</span>
                        {% else %}
                            <span class="text-agro-700 font-semibold"><i class="fa-solid fa-user-pen mr-1"></i>Content Admin</span>
                        {% endif %}
                    </div>
                </div>
                <form action="{% url 'core:legacy_logout' %}" method="post" class="inline">
                    {% csrf_token %}
                    <button type="submit" class="px-3 py-2 text-sm font-semibold text-red-600 hover:bg-red-50 rounded-lg transition" title="Logout">
                        <i class="fa-solid fa-right-from-bracket mr-1"></i><span class="hidden sm:inline">लगआउट</span>
                    </button>
                </form>
            </div>
        </div>
        <div class="md:hidden flex flex-wrap gap-2 pb-3 pt-1 border-t border-slate-100">
            <a href="{% url 'core:legacy_dashboard' %}" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold {% if request.resolver_match.url_name == 'legacy_dashboard' %}text-agro-700 bg-agro-50{% else %}text-slate-600 bg-slate-50{% endif %}">ड्यासबोर्ड</a>
            <a href="{% url 'core:legacy_crops_list' %}" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold {% if 'legacy_crop' in request.resolver_match.url_name %}text-agro-700 bg-agro-50{% else %}text-slate-600 bg-slate-50{% endif %}">बाली</a>
            <a href="{% url 'core:legacy_guides_list' %}" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold {% if 'legacy_guide' in request.resolver_match.url_name %}text-agro-700 bg-agro-50{% else %}text-slate-600 bg-slate-50{% endif %}">खेती विधि</a>
            <a href="{% url 'core:legacy_farmers' %}" class="px-2.5 py-1.5 rounded-lg text-xs font-semibold {% if request.resolver_match.url_name == 'legacy_farmers' %}text-agro-700 bg-agro-50{% else %}text-slate-600 bg-slate-50{% endif %}">किसानहरू</a>
        </div>
    </div>
</nav>
{% endif %}
