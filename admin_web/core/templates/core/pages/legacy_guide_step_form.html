{% extends 'core/legacy_base.html' %}

{% block title %}नयाँ चरण थप्नुहोस् - {{ guide.title_ne }}{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <div class="text-xs font-bold text-agro-700 uppercase">{{ guide.title_ne }}</div>
            <h1 class="text-2xl font-black text-slate-900 tracking-tight mt-1">खेती चरण विवरण थप्नुहोस् (Add Stage)</h1>
        </div>
        <a href="{% url 'core:legacy_guide_detail' guide.id %}" class="text-sm font-semibold text-slate-500 hover:text-slate-800">← निर्देशिकामा फर्कनुहोस्</a>
    </div>

    <div class="bg-white p-6 sm:p-8 rounded-2xl border border-slate-200 shadow-sm">
        <form method="post" class="space-y-6">
            {% csrf_token %}

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-6">
                <div>
                    <label class="block text-sm font-bold text-slate-700 mb-1">चरण नम्बर (Step #) *</label>
                    <input type="number" name="step_number" value="{{ next_step }}" min="1" max="50" required class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-agro-600">
                </div>
                <div class="sm:col-span-2">
                    <label class="block text-sm font-bold text-slate-700 mb-1">चरण शीर्षक (नेपाली) *</label>
                    <input type="text" name="title_ne" required placeholder="उदा: १. जग्गा तयारी वा बीउ छनोट" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-agro-600">
                </div>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">Title in English *</label>
                <input type="text" name="title_en" required placeholder="e.g. Land Preparation" class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-agro-600">
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">चरणको सम्पूर्ण कार्यविधि (Step Instructions in Nepali) *</label>
                <textarea name="content_ne" rows="4" required placeholder="किसानले यस चरणमा के के गर्ने..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-agro-600"></textarea>
            </div>

            <div>
                <label class="block text-sm font-bold text-slate-700 mb-1">किसानका लागि विशेष सुझाव (Expert Tips)</label>
                <textarea name="tips_ne" rows="2" placeholder="विशेष सावधानी वा उत्पादन बढाउने गोप्य सुझाव..." class="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-agro-600"></textarea>
            </div>

            <div class="flex justify-end space-x-4 pt-4 border-t border-slate-100">
                <a href="{% url 'core:legacy_guide_detail' guide.id %}" class="px-5 py-2.5 rounded-xl border border-slate-300 text-slate-700 text-sm font-bold hover:bg-slate-50 transition">रद्द गर्नुहोस्</a>
                <button type="submit" class="px-6 py-2.5 rounded-xl bg-agro-700 text-white text-sm font-bold hover:bg-agro-800 transition shadow-sm">
                    <i class="fa-solid fa-check mr-2"></i>चरण सुरक्षित गर्नुहोस् (Save Stage)
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
